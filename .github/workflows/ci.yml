name: CI

on:
  pull_request:
  push:
    branches: [main, melhorias/qualidade-e-requisitos]

# O pipeline só precisa ler o código e publicar artefatos do próprio run.
permissions:
  contents: read

# Evita gastar runners em execuções antigas da mesma branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar Docker
        run: |
          docker version
          docker info

      - name: Build, testes e cobertura (JaCoCo)
        env:
          DOCKER_API_VERSION: "1.44"
        run: mvn -B verify


      - name: Medir cobertura JaCoCo
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          path = "target/site/jacoco/jacoco.xml"
          counters = {
              item.get("type"): item
              for item in ET.parse(path).getroot().findall("counter")
          }
          rows = ["## Cobertura de testes — JaCoCo", "", "| Métrica | Resultado | Meta | Situação |", "|---|---:|---:|---|"]
          for label, kind, target in [("Linhas", "LINE", 80), ("Branches", "BRANCH", 70)]:
              item = counters[kind]
              hit, missed = int(item.get("covered")), int(item.get("missed"))
              total = hit + missed
              percentage = 100 * hit / total if total else 0
              status = "Atingida" if percentage >= target else "Abaixo da meta"
              print(f"{label}: {percentage:.2f}% ({hit}/{total}), meta {target}% — {status}")
              rows.append(f"| {label} | {percentage:.2f}% | {target}% | {status} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(rows) + "\n")
          PY

      - name: Analisar no SonarCloud
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Validar Docker Compose
        env:
          DB_PASSWORD: ci-temporary-password
          APP_ADMIN_USERNAME: ci-admin
          APP_ADMIN_PASSWORD: ci-temporary-admin-password
        run: docker compose config --quiet

      - name: Construir imagem da aplicação
        run: docker build --tag organizacao-recursos:ci .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
