name: CI

on:
  pull_request:
  push:
    branches: [main, melhorias/qualidade-e-requisitos]

# O pipeline só precisa ler o código e publicar artefatos do próprio run.
permissions:
  contents: read

# Evita gastar runners em execuções antigas da mesma branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar Docker
        run: |
          docker version
          docker info

      - name: Build, testes e cobertura (JaCoCo)
        env:
          DOCKER_API_VERSION: "1.44"
        run: mvn -B verify


      - name: Analisar no SonarCloud
        if: ${{ secrets.SONAR_TOKEN != '' && vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Validar Docker Compose
        env:
          DB_PASSWORD: ci-temporary-password
          APP_ADMIN_USERNAME: ci-admin
          APP_ADMIN_PASSWORD: ci-temporary-admin-password
        run: docker compose config --quiet

      - name: Construir imagem da aplicação
        run: docker build --tag organizacao-recursos:ci .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore
