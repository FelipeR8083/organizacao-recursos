name: JMeter - Carga de Reservas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jmeter.yml'
      - 'jmeter/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concorrencia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      # Senhas efemeras geradas no runner; nunca usar literais versionados.
      - name: Gerar credenciais efemeras de CI
        shell: bash
        run: |
          db_senha="$(openssl rand -hex 24)"
          admin_senha="$(openssl rand -hex 24)"
          echo "::add-mask::$db_senha"
          echo "::add-mask::$admin_senha"
          printf 'DB_PASSWORD=%s\n' "$db_senha" >> "$GITHUB_ENV"
          printf 'APP_ADMIN_USERNAME=admin-carga\n' >> "$GITHUB_ENV"
          printf 'APP_ADMIN_PASSWORD=%s\n' "$admin_senha" >> "$GITHUB_ENV"

      - name: Subir aplicação e PostgreSQL
        run: docker compose up --build -d

      - name: Aguardar API e cadastrar recurso de carga
        run: |
          for i in $(seq 1 90); do
            if curl --max-time 3 -sf -u "$APP_ADMIN_USERNAME:$APP_ADMIN_PASSWORD" http://localhost:8080/sessao > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS -u "$APP_ADMIN_USERNAME:$APP_ADMIN_PASSWORD" http://localhost:8080/sessao
          # API exige CSRF mesmo em CI: preservar cookie da sessao em GET e POST.
          cookies="$RUNNER_TEMP/cookies-jmeter-setup.txt"
          csrf_json=$(curl -fsS -u "$APP_ADMIN_USERNAME:$APP_ADMIN_PASSWORD" \
            -c "$cookies" -b "$cookies" http://localhost:8080/csrf)
          csrf_token=$(printf '%s' "$csrf_json" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["enabled"] and r["token"]; print(r["token"])')
          response=$(curl -fsS -u "$APP_ADMIN_USERNAME:$APP_ADMIN_PASSWORD" \
            -c "$cookies" -b "$cookies" \
            -H 'Content-Type: application/json' -H "X-CSRF-TOKEN: $csrf_token" \
            -d '{"tipo":"SALA","nome":"Sala para JMeter","restrito":false,"emManutencao":false}' \
            http://localhost:8080/recursos)
          RESOURCE_ID=$(echo "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          echo "RESOURCE_ID=$RESOURCE_ID" >> "$GITHUB_ENV"

      - name: Instalar JMeter 5.6.3 com verificação SHA512
        run: |
          # Permitir somente HTTPS, inclusive ao seguir redirecionamentos.
          curl --retry 3 --proto '=https' --proto-redir '=https' -fsSL -O https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          curl --retry 3 --proto '=https' --proto-redir '=https' -fsSL -O https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz.sha512
          sha512sum -c apache-jmeter-5.6.3.tgz.sha512
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Executar 20 tentativas de reserva simultâneas
        env:
          HEAP: '-Xms512m -Xmx512m'
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter -n -t jmeter/reservas-concorrentes.jmx \
            -Jhost=localhost -Jport=8080 -JbaseUrl=http://localhost:8080 \
            -Jlogin="$APP_ADMIN_USERNAME" -Jpassword="$APP_ADMIN_PASSWORD" \
            -JresourceId="$RESOURCE_ID" -Jthreads=20 \
            -Jstart=2030-12-01T10:00:00Z -Jend=2030-12-01T11:00:00Z \
            -l resultados-reservas.jtl -e -o relatorio-jmeter

      - name: Avaliar resultados de concorrência
        run: |
          python3 - <<'PY'
          import csv, collections, math, statistics
          with open('resultados-reservas.jtl', newline='', encoding='utf-8') as arquivo:
              amostras = list(csv.DictReader(arquivo))
          # Plano atual realiza um GET /csrf antes de cada POST /reservas.
          preflight = [r for r in amostras if r.get('label') == 'Obter token CSRF']
          dados = [r for r in amostras if r.get('label') == 'Solicitar reserva concorrente']
          assert len(preflight) == 20, 'Esperados 20 tokens CSRF por thread'
          assert all(r.get('responseCode') == '200' for r in preflight), 'Falha ao obter token CSRF'
          codigos = collections.Counter(r.get('responseCode') for r in dados)
          print('Amostras:', len(dados), 'Códigos:', dict(codigos))
          tempos = sorted(int(r.get('elapsed') or 0) for r in dados)
          if tempos:
              print('Latência média (ms):', round(statistics.mean(tempos), 1))
              # Posto mais proximo: para N=20, P95 e o 19o valor, nao o maximo.
              p95 = tempos[math.ceil(0.95 * len(tempos)) - 1]
              print('P95 (ms):', p95)
              print('Máximo (ms):', tempos[-1])
          assert len(dados) == 20, 'Esperadas 20 requisições'
          assert codigos['201'] == 1, 'Deve existir exatamente uma reserva criada'
          assert codigos['409'] == 19, 'As 19 solicitações restantes devem receber conflito'
          with open('resultado-jmeter.md','w',encoding='utf-8') as f:
              f.write('# Teste de concorrência JMeter\n\n')
              f.write(f'Amostras: {len(dados)}; HTTP 201: {codigos["201"]}; HTTP 409: {codigos["409"]}.\n')
              f.write('Critério: somente uma reserva aceita e dezenove conflitos.\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidencias-jmeter
          path: |
            resultados-reservas.jtl
            resultado-jmeter.md
            relatorio-jmeter/
          if-no-files-found: warn

      - name: Logs da aplicação em caso de falha
        if: failure()
        run: docker compose logs --tail=250 app db

      - name: Encerrar contêineres
        if: always()
        run: docker compose down
