spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recursos}
    username: ${DB_USER:recursos}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

app:
  email:
    remetente: ${EMAIL_REMETENTE:no-reply@senac.br}
    url-publica: ${APP_PUBLIC_URL:http://localhost:8080}
    envio-habilitado: ${EMAIL_ENVIO_HABILITADO:false}
